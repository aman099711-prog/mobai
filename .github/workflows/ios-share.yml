name: iOS Simulator

run-name: iOS Simulator ${{ inputs.build_id || github.ref_name }}

# Builds the app for the simulator and then makes that simulator usable from
# the MobAI app, so the build can be tried by hand from a machine that is not a
# Mac. The job stays alive while the simulator is in use and ends when it is
# released or left unused.
#
# Simulator builds are never signed, so none of the signing setup in
# ios-build.yml applies here.

on:
  # Pushing a tag named ios-share/<build-id> starts the same job without the
  # GitHub API.
  push:
    tags:
      - 'ios-share/*'

  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique build identifier'
        required: true
        type: string

      snapshot_ref:
        description: 'Ref holding the working-tree snapshot to build'
        required: false
        type: string
        default: ''

      ios_path:
        description: 'Path to iOS project (e.g., "ios" for React Native)'
        required: false
        type: string
        default: '.'

      scheme:
        description: 'Xcode scheme to build (auto-detected if empty)'
        required: false
        type: string
        default: ''

      duration:
        description: 'How long the simulator stays available while unused'
        required: false
        type: string
        default: '30m'

      flutter_version:
        description: 'Flutter version to use. Empty means latest stable.'
        required: false
        type: string
        default: ''

      jdk_version:
        description: 'JDK version for Kotlin Multiplatform Gradle builds'
        required: false
        type: string
        default: '17'


jobs:
  simulator:
    runs-on: macos-latest

    permissions:
      contents: write

    timeout-minutes: 90

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout working-tree snapshot
        if: inputs.snapshot_ref != ''
        env:
          SNAPSHOT_REF: ${{ inputs.snapshot_ref }}
        run: |
          set -e

          git fetch --depth=1 origin \
            "+$SNAPSHOT_REF:refs/heads/snapshot"

          git checkout --force snapshot

          echo "Building $(git rev-parse --short HEAD)"


      # ------------------------------------------------------------
      # Resolve parameters
      # ------------------------------------------------------------

      - name: Resolve parameters
        id: params
        env:
          IN_BUILD_ID: ${{ inputs.build_id }}
          IN_IOS_PATH: ${{ inputs.ios_path }}
          IN_SCHEME: ${{ inputs.scheme }}
          IN_DURATION: ${{ inputs.duration }}
          IN_FLUTTER_VERSION: ${{ inputs.flutter_version }}
          IN_JDK_VERSION: ${{ inputs.jdk_version }}
        run: |
          set -e

          param() {
            local v=""

            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              v="$2"
            elif [ -f builder.json ]; then
              v=$(jq -r "$3 // empty" builder.json)
            fi

            v="${v:-$4}"

            echo "$1=$v" >> "$GITHUB_OUTPUT"
            echo "$1=$v"
          }

          param build_id \
            "$IN_BUILD_ID" \
            '""' \
            "${GITHUB_REF_NAME##*/}"

          param ios_path \
            "$IN_IOS_PATH" \
            '.ios.path' \
            '.'

          param scheme \
            "$IN_SCHEME" \
            '.ios.scheme' \
            ''

          param duration \
            "$IN_DURATION" \
            '""' \
            '30m'

          param flutter_version \
            "$IN_FLUTTER_VERSION" \
            '.flutter.version' \
            ''

          param jdk_version \
            "$IN_JDK_VERSION" \
            '.kmp.jdkVersion' \
            '17'


      # ------------------------------------------------------------
      # Start MobAI iOS Simulator
      # ------------------------------------------------------------

      - name: Install mobai-ci + boot simulator
        uses: MobAI-App/mobai-ci@v1
        with:
          boot-sim: true
          sim-cache-key: v2


      # ------------------------------------------------------------
      # Xcode
      # ------------------------------------------------------------

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable


      # ------------------------------------------------------------
      # DerivedData cache
      # ------------------------------------------------------------

      - name: Restore DerivedData cache
        uses: actions/cache/restore@v4
        with:
          path: DerivedData
          key: deriveddata-sim-${{ github.run_id }}
          restore-keys: |
            deriveddata-sim-


      # ------------------------------------------------------------
      # Detect project type
      # ------------------------------------------------------------

      - name: Detect project type
        id: detect
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "type=flutter" >> "$GITHUB_OUTPUT"

          elif [ -f "package.json" ] && \
               grep -q '"expo"' package.json; then
            echo "type=expo" >> "$GITHUB_OUTPUT"

          elif [ -f "package.json" ] && \
               grep -q '"react-native"' package.json; then
            echo "type=reactnative" >> "$GITHUB_OUTPUT"

          elif grep -rqlE \
            'kotlin\("multiplatform"\)|org\.jetbrains\.kotlin\.multiplatform|id\("org.jetbrains.kotlin.multiplatform"\)' \
            --include='*.gradle.kts' \
            --include='*.gradle' \
            --include='libs.versions.toml' \
            . 2>/dev/null; then

            echo "type=kmp" >> "$GITHUB_OUTPUT"

          else
            echo "type=native" >> "$GITHUB_OUTPUT"
          fi


      # ------------------------------------------------------------
      # Materialize xcconfig files
      # ------------------------------------------------------------

      - name: Materialize missing xcconfig files
        run: |
          set -e

          find . \
            -path ./DerivedData -prune \
            -o \
            -type f \
            \( \
              -name '*.xcconfig.template' \
              -o -name '*.xcconfig.example' \
              -o -name '*.xcconfig.sample' \
              -o -name '*.template.xcconfig' \
              -o -name '*.example.xcconfig' \
              -o -name '*.sample.xcconfig' \
            \) \
            -print |
          while IFS= read -r template; do

            case "$template" in
              *.xcconfig.template|*.xcconfig.example|*.xcconfig.sample)
                target="${template%.*}"
                ;;

              *)
                target="$(dirname "$template")/$(basename "$template" |
                  sed -E \
                  's/\.(template|example|sample)\.xcconfig$/.xcconfig/')"
                ;;
            esac

            if [ ! -f "$target" ]; then
              cp "$template" "$target"

              echo "::warning::$target was missing; copied $template"
            fi

          done


      # ------------------------------------------------------------
      # XcodeGen
      # ------------------------------------------------------------

      - name: Generate Xcode project (XcodeGen)
        env:
          IOS_PATH: ${{ steps.params.outputs.ios_path }}
        run: |
          set -e

          cd "$IOS_PATH"

          MANIFEST=""

          for f in project.yml project.yaml; do
            if [ -f "$f" ] && grep -qE '^targets:' "$f"; then
              MANIFEST="$f"
              break
            fi
          done

          if [ -z "$MANIFEST" ]; then
            echo "No XcodeGen manifest — skipping."

          elif [ -n "$(find . -maxdepth 1 \
            -name '*.xcodeproj' -print -quit)" ]; then

            echo "Found a committed .xcodeproj — skipping generation."

          else
            echo "Found $MANIFEST and no .xcodeproj — generating."

            brew install xcodegen

            xcodegen generate
          fi


      # ------------------------------------------------------------
      # Check base configuration
      # ------------------------------------------------------------

      - name: Check base configuration files
        env:
          IOS_PATH: ${{ steps.params.outputs.ios_path }}
        run: |
          set -e

          MISSING=""

          for pbx in $(find "$IOS_PATH" \
            -maxdepth 2 \
            -name project.pbxproj \
            -not -path '*/Pods.xcodeproj/*'); do

            for id in $(grep -o \
              'baseConfigurationReference = [A-Za-z0-9]*' \
              "$pbx" |
              awk '{print $3}' |
              sort -u); do

              ref=$(grep -m1 \
                "^[[:space:]]*$id .*isa = PBXFileReference" \
                "$pbx" || true)

              name=$(printf '%s' "$ref" |
                sed -n \
                's/.*[ \t]path = "\{0,1\}\([^";]*\)"\{0,1\};.*/\1/p')

              [ -n "$name" ] || continue

              base=$(basename "$name")

              case "$name" in
                *Pods/*|*"Target Support Files"*)
                  continue
                  ;;
              esac

              case "$base" in
                Pods-*|Generated.xcconfig)
                  continue
                  ;;
              esac

              if [ -z "$(find . \
                -name "$base" \
                -print -quit)" ]; then

                MISSING="$MISSING $base"
              fi

            done
          done

          if [ -n "$MISSING" ]; then
            echo "::error::Missing base configuration files:$MISSING"
            exit 1
          fi


      # ------------------------------------------------------------
      # Flutter
      # ------------------------------------------------------------

      - name: Setup Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.params.outputs.flutter_version || '' }}
          channel: stable
          cache: true

      - name: Flutter pub get
        if: steps.detect.outputs.type == 'flutter'
        run: flutter pub get


      # ------------------------------------------------------------
      # React Native / Expo
      # ------------------------------------------------------------

      - name: Setup Node.js
        if: steps.detect.outputs.type == 'reactnative' || steps.detect.outputs.type == 'expo'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install npm dependencies
        if: steps.detect.outputs.type == 'reactnative' || steps.detect.outputs.type == 'expo'
        run: npm install


      # ------------------------------------------------------------
      # Kotlin Multiplatform
      # ------------------------------------------------------------

      - name: Setup JDK
        if: steps.detect.outputs.type == 'kmp'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.params.outputs.jdk_version || '17' }}

      - name: Setup Gradle
        if: steps.detect.outputs.type == 'kmp'
        uses: gradle/actions/setup-gradle@v6


      # ------------------------------------------------------------
      # Build iOS Simulator application
      # ------------------------------------------------------------

      - name: Build for the simulator
        id: build
        env:
          IOS_PATH: ${{ steps.params.outputs.ios_path }}
          SCHEME: ${{ steps.params.outputs.scheme }}
          PROJECT_TYPE: ${{ steps.detect.outputs.type }}
        run: |
          set -e

          if [ "$PROJECT_TYPE" = "flutter" ]; then

            echo "Building Flutter iOS simulator application..."

            flutter build ios --simulator --debug

            APP_PATH=$(find \
              build/ios/iphonesimulator \
              -maxdepth 1 \
              -name '*.app' \
              -print \
              -quit)

          else

            cd "$IOS_PATH"

            # Install CocoaPods if necessary.
            if [ -f Podfile ]; then

              command -v pod >/dev/null 2>&1 ||
                gem install cocoapods --no-document

              pod install
            fi

            WORKSPACE=$(find . \
              -maxdepth 1 \
              -name '*.xcworkspace' \
              -print \
              -quit)

            PROJECT=$(find . \
              -maxdepth 1 \
              -name '*.xcodeproj' \
              -print \
              -quit)

            if [ -n "$WORKSPACE" ]; then

              TARGET_FLAG=-workspace
              TARGET_PATH="$WORKSPACE"
              BASE=$(basename "$WORKSPACE" .xcworkspace)

            elif [ -n "$PROJECT" ]; then

              TARGET_FLAG=-project
              TARGET_PATH="$PROJECT"
              BASE=$(basename "$PROJECT" .xcodeproj)

            else

              echo "::error::No .xcworkspace or .xcodeproj found in $IOS_PATH"
              exit 1
            fi

            # Auto-detect scheme.
            if [ -z "$SCHEME" ]; then

              SCHEMES=$(
                xcodebuild \
                  "$TARGET_FLAG" \
                  "$TARGET_PATH" \
                  -list \
                  -json 2>/dev/null |
                jq -r \
                  '(.workspace // .project).schemes[]?' ||
                true
              )

              if [ -z "$SCHEMES" ]; then

                SCHEMES=$(
                  xcodebuild \
                    "$TARGET_FLAG" \
                    "$TARGET_PATH" \
                    -list 2>/dev/null |
                  sed -n '/Schemes:/,$p' |
                  tail -n +2 |
                  sed 's/^[[:space:]]*//' |
                  sed '/^$/d' ||
                  true
                )
              fi

              echo "Available schemes:"
              printf '%s\n' "$SCHEMES" |
                sed 's/^/  /'

              SCHEME=$(
                printf '%s\n' "$SCHEMES" |
                grep -Fx "$BASE" |
                head -1 ||
                true
              )

              if [ -z "$SCHEME" ]; then

                SCHEME=$(
                  printf '%s\n' "$SCHEMES" |
                  grep -v '^Pods-' |
                  while IFS= read -r s; do

                    [ -n "$s" ] || continue

                    [ -z "$(find . \
                      -maxdepth 4 \
                      -path "*/$s/Package.swift" \
                      -print \
                      -quit)" ] ||
                      continue

                    printf '%s\n' "$s"
                    break

                  done
                )
              fi
            fi

            if [ -z "$SCHEME" ]; then
              echo "::error::Could not determine a scheme."
              echo "::error::Pass the scheme using the workflow input."
              exit 1
            fi

            echo "Scheme: $SCHEME"

            # Build specifically for the MobAI simulator.
            if [ -n "$MOBAI_SIM_UDID" ]; then

              DEST_FLAG=-destination
              DEST_VALUE="id=$MOBAI_SIM_UDID"

            else

              DEST_FLAG=-sdk
              DEST_VALUE=iphonesimulator

            fi

            xcodebuild \
              "$TARGET_FLAG" "$TARGET_PATH" \
              -scheme "$SCHEME" \
              -configuration Debug \
              "$DEST_FLAG" "$DEST_VALUE" \
              -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              CODE_SIGNING_ALLOWED=NO \
              build

            # Find the application produced by the scheme.
            APP_PATH=$(
              xcodebuild \
                "$TARGET_FLAG" "$TARGET_PATH" \
                -scheme "$SCHEME" \
                -configuration Debug \
                "$DEST_FLAG" "$DEST_VALUE" \
                -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
                -showBuildSettings \
                -json 2>/dev/null |
              jq -r '
                map(.buildSettings)
                | map(
                    select(
                      .PRODUCT_TYPE ==
                      "com.apple.product-type.application"
                      and
                      (.TARGET_BUILD_DIR |
                      contains("-iphonesimulator"))
                    )
                  )
                | map(
                    .TARGET_BUILD_DIR +
                    "/" +
                    .FULL_PRODUCT_NAME
                  )
                | first // empty
              ' ||
              true
            )

            if [ ! -d "$APP_PATH" ]; then

              APP_PATH=$(
                find \
                  "$GITHUB_WORKSPACE/DerivedData/Build/Products/Debug-iphonesimulator" \
                  -maxdepth 1 \
                  -name '*.app' \
                  -print \
                  -quit 2>/dev/null ||
                true
              )
            fi

            cd "$GITHUB_WORKSPACE"

          fi

          if [ -z "$APP_PATH" ]; then
            echo "::error::Build produced no .app"
            exit 1
          fi

          echo "Built: $APP_PATH"

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"


      # ------------------------------------------------------------
      # DerivedData cache
      # ------------------------------------------------------------

      - name: Check for DerivedData
        id: dd
        if: always()
        run: |
          if [ -d DerivedData ]; then
            echo "exists=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Save DerivedData cache
        if: always() && steps.dd.outputs.exists == 'yes'
        uses: actions/cache/save@v6
        with:
          path: DerivedData
          key: deriveddata-sim-${{ github.run_id }}


      # ------------------------------------------------------------
      # Share simulator with MobAI
      # ------------------------------------------------------------

      - name: Share the simulator
        env:
          MOBAI_API_KEY: ${{ secrets.MOBAI_API_KEY }}
        run: |
          set -e

          mobai-ci share \
            --device "$MOBAI_SIM_UDID" \
            --app "${{ steps.build.outputs.app_path }}" \
            --duration "${{ steps.params.outputs.duration }}" \
            --label "${{ github.repository }} · ${{ steps.params.outputs.build_id }}" \
            --wait-device 4m \
            --startup-timeout 5m


      # ------------------------------------------------------------
      # Delete trigger tag
      # ------------------------------------------------------------

      - name: Delete trigger tag
        if: always() && github.ref_type == 'tag'
        run: |
          git push origin ":refs/tags/$GITHUB_REF_NAME"